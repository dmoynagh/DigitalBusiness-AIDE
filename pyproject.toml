[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "aide-tools"
version = "0.1.0"
description = "AIDE infrastructure utilities dispatcher"
requires-python = ">=3.9"

[project.scripts]
aide = "aide.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aide = ["defaults.json"]
